# Ground truth for the Neon Data API fixture.
#
# Every line below was MEASURED against project still-wildflower-86993864 on
# 2026-08-21, not taken from vendor documentation. Where the docs and the
# observed behaviour disagree, the observation wins and the disagreement is
# recorded.

endpoint: https://ep-weathered-star-axawuz2r.apirest.c-4.us-east-2.aws.neon.tech/neondb/rest/v1
auth:
  provider: neon_auth        # undocumented auth_provider value; keys live in
                             # neon_auth.jwks (Ed25519), not fetched over HTTP
  url: https://ep-weathered-star-axawuz2r.neonauth.c-4.us-east-2.aws.neon.tech/neondb/auth
  signup: open               # anyone on the web can sign up; no email
                             # verification required. This is what makes the
                             # escalation below reachable by a stranger.
  obtaining_a_token: |
    POST {auth}/sign-up/email  with an Origin header (MISSING_ORIGIN without it)
    POST {auth}/sign-in/email  -> sets a session cookie
    GET  {auth}/token          with that COOKIE (a bearer is rejected 401)
                               -> EdDSA JWT whose kid matches neon_auth.jwks

transport:
  # A request with NO Authorization header does NOT map to the anonymous role.
  # Refused identically for every table, including tables anonymous has no
  # grant on -- so it carries no information and must not be read as
  # "protected". True under both the external and neon_auth providers.
  no_auth_header:
    status: 400
    body_message: "missing authentication credentials: required authorization bearer token in JWT format"
    discriminating: false
    expect_blind_id: unruly-target-not-discriminating
  # Under a valid JWT the target IS discriminating: 403/42501, 200-with-rows
  # and 200-empty are all distinguishable.
  malformed_bearer:
    status: 400
    body_message: "Provided authentication token is not a valid JWT encoding"

# The Data API's schema cache is a SNAPSHOT, and nothing an operator can reach
# refreshes it. Measured 2026-08-22, in this order:
#
#   create function public.unruly_lab_open_routine()  -> POST /rpc/... 404 PGRST202
#   notify pgrst, 'reload schema'   (PostgREST's own documented reload)
#                                   -> no change, polled 6 times over 2 minutes
#   restart the compute endpoint    (Neon Management API)
#                                   -> no change; the Data API is a separate service
#   create table public.unruly_cache_probe + grant
#                                   -> GET /unruly_cache_probe 404 PGRST205
#
# So it is not about functions, and it is not a slow cadence. Two consequences,
# and the second is the one that reaches beyond this fixture:
#
#   1. The RPC surface is served but nothing behind it can be demonstrated on
#      this project, which is why CapExecute stays in Cannot().
#   2. A 404 from this API does NOT mean the relation is absent from the
#      database. It means the relation is absent from the CACHE. A scanner that
#      reads PGRST205 as "no such table" will under-report on any Neon project
#      whose schema grew after the Data API was switched on.
#
# The six tables below predate that switch-on, which is why they are visible at
# all, and every one of them was corroborated against the database as owner
# rather than through the API alone.
# The hint oracle works here, and it is the enumeration route the OpenAPI root
# is not. Measured 2026-08-22, after an earlier note in this project wrongly
# concluded from the unserved OpenAPI root that Neon could not be enumerated:
#
#   GET /rls_disable            -> 404 PGRST205, hint "Perhaps you meant the
#                                  table 'public.rls_disabled'"
#   GET /anon_readabl           -> 404 PGRST205, hint names anon_readable
#   GET /totally_unrelated_xyz  -> 404 PGRST205, hint null
#
# The last line is what makes it an oracle rather than noise: a candidate
# unlike anything in the schema draws nothing, so a hint is evidence about THIS
# schema. End to end, three near-miss seeds recovered all six tables below,
# three of which were never guessed at.
#
# Requires a credential. A headerless request is refused before any name is
# consulted, so the oracle is silent without one -- and silence there is
# indistinguishable from a project with no tables.
# The seeded row counts, which are what "the lab is in its known state" means.
#
# Lived as a literal in two test files and nowhere authoritative, so a probe
# that left a row behind would change what the parity and end-to-end evals
# measure while both files still agreed with each other. Ground truth belongs
# in the ground-truth file.
#
# Every live eval verifies these before grading and SKIPS if they do not hold:
# a drifted fixture means the check could not measure what it claims to, and
# the audit renders a skipped check as "not run", which is visible. Grading
# against a lab that no longer matches this file would report a regression in
# the scanner for a change in the laboratory.
fixture_seed:
  anon_readable: 2
  open_guestbook: 1
  rls_disabled: 3
  rls_enforced: 2

hint_oracle:
  volunteers_names: true
  requires_credential: true
  unrelated_name_draws_nothing: true
  recovered_from_three_near_misses: 6

data_api_schema_cache:
  refreshes_on_notify: false
  refreshes_on_compute_restart: false
  affects: [tables, functions]
  not_found_means: absent from the cache, not absent from the database

exploitable:
  - table: rls_disabled
    id: rls-disabled-authenticated-read
    technique: neon-escalation
    capability: CapEscalate
    expect_rows: 3
    scanner_finding: neon-authenticated-read-unrestricted
    why: RLS never enabled; GRANT SELECT TO authenticated
    measured:
      as: authenticated (freshly self-signed-up account)
      status: 200
      rows_returned: 3           # every row, including other users'
      evidence_field: card_last4 # belonging to user-alpha/beta/gamma
    severity_note: |
      A stranger can sign up unaided and read every row. This is Neon's
      headline accident and it inverts Supabase's emphasis, where the
      anonymous key is the usual culprit.

  - table: open_guestbook
    id: open-guestbook-authenticated-insert
    technique: neon-write
    column: body
    capability: CapWrite
    scanner_finding: neon-authenticated-write-allowed
    why: GRANT SELECT, INSERT TO anonymous, authenticated
    measured:
      as: authenticated
      status: 200
      rows_returned: 1           # the seed row, returned to any account
      read: {status: 200}
      # Two payloads, two purposes. The SCANNER sends {} because it cannot know
      # a column name and must not invent one; the exploit harness sends a
      # marker because a demonstration has to be identifiable afterwards to be
      # cleaned up. Both are measured.
      insert_empty_object: {status: 201}
      insert_with_marker: {status: 201, returned_representation: true}

  - table: anon_readable
    id: anon-readable-anonymous-read
    technique: neon-unmeasurable-over-http
    capability: CapRead
    why: >-
      GRANT SELECT TO anonymous, and the anonymous role cannot be assumed over
      HTTP on this configuration -- a request with no Authorization header is
      refused before any table is consulted
    measured:
      as: authenticated
      status: 403
      code: "42501"
      note: |
        Correct: only the anonymous role holds this grant, and the anonymous
        role is unreachable over HTTP on this configuration. The anonymous
        read remains UNMEASURED over the API -- it is proven at the database
        level by the grant, not by a request. Do not grade it as measured.

protected:
  - table: owner_only
    why: no grants to anonymous or authenticated
    measured: {status: 403, code: "42501", insert_status: 403}
    console_disagreement: |
      Neon's own console warns that owner_only "has RLS disabled. All
      authenticated users can view all rows." That is FALSE -- there is no
      grant, so authenticated gets 42501. Neon's warning is RLS-aware but not
      grant-aware. A grant-aware scanner is more accurate than the vendor
      console here; this is a benchmark datapoint.

  - table: rls_enforced
    why: RLS on, policy restricts rows to auth.user_id()
    measured:
      other_users_rows: {status: 200, rows: 0}
      own_row: {status: 200, rows: 1}
    note: |
      Both observations are required. A single empty read cannot distinguish
      a correct policy from deny-all; inserting a row owned by the probe's
      own sub and seeing exactly that row come back is what proves the policy
      FILTERS rather than blocks.

  - table: rls_no_policy
    why: RLS on and granted, but zero policies -- deny-all
    measured:
      other_users_rows: {status: 200, rows: 0}
      own_row: {status: 200, rows: 0}   # stays empty; this is what separates
                                        # it from rls_enforced
