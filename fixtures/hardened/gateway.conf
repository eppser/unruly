# Kong stands in front of every managed Supabase project and routes the
# sub-services under one origin. The hardened fixture is meant to model a
# CORRECTLY configured project, and a project with no auth and no storage is
# not a configuration a real operator can have -- so without this the fixture
# was measuring precision against a target that is missing two of the surfaces
# the scanner checks.
#
# Concretely: the scan reported auth and storage as "not assessed", which is
# true and correct, but it meant the hardened fixture could never demonstrate a
# complete clean scan. Exit code 0 was unreachable.
#
# These responses are the shape a correctly configured project returns:
# signup closed, and no buckets at all.
server {
  listen 80;

  location = /auth/v1/settings {
    default_type application/json;
    return 200 '{"external":{"email":false,"phone":false},"disable_signup":true,"mailer_autoconfirm":false,"phone_autoconfirm":false,"saml_enabled":false}';
  }

  location = /storage/v1/bucket {
    default_type application/json;
    return 200 '[]';
  }

  # Storage object path. A managed project answers a request for an object in
  # a bucket that does not exist with "Bucket not found", which is what makes
  # bucket existence decidable without listing. Without this route the request
  # fell through to PostgREST, whose 404 says nothing about buckets, so the
  # scanner's control probe correctly concluded it could not tell buckets apart
  # and reported the surface unassessed -- costing this fixture its exit 0.
  location /storage/v1/object/public/ {
    default_type application/json;
    return 400 '{"statusCode":"404","error":"Bucket not found","message":"Bucket not found"}';
  }

  # Edge Functions: nothing is deployed, so every name is absent.
  location /functions/v1/ {
    default_type application/json;
    return 404 '{"error":"Function not found"}';
  }

  # Realtime: accept the websocket upgrade, publish nothing. A correctly
  # configured project has the endpoint and an empty publication.
  location /realtime/v1/websocket {
    proxy_pass http://realtime:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location / {
    proxy_pass http://rest:3000;
    proxy_set_header Host $host;
  }
}
