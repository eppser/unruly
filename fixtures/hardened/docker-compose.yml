# Compose project name is explicit. Without it Docker derives it from the
# DIRECTORY name, so two checkouts of this repository on one machine both
# produce a project called "lab" and silently reuse each other's containers
# and volumes — which presents as a database with no tables and initdb
# reporting "ignoring /docker-entrypoint-initdb.d/*".
#
# Note the fixtures bind FIXED host ports, so only one checkout can run them
# at a time. That is deliberate: the eval targets record those ports, and a
# scan is meant to be reproducible from the committed answer key.
name: unruly-hardened

# Hardened counterpart to fixtures/lab. Same stack, correct configuration.
# Runs on different ports so both fixtures can be up at once.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: fixture
      POSTGRES_DB: fixture
    ports: ["54339:5432"]
    volumes: ["./schema:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fixture"]
      interval: 2s
      timeout: 3s
      retries: 30
  rest:
    image: public.ecr.aws/supabase/postgrest:v14.3
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGRST_DB_URI: postgres://authenticator:fixture@db:5432/fixture
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      PGRST_DB_USE_LEGACY_GUCS: "false"
    expose: ["3000"]

  # Stands in for Kong: one origin serving PostgREST plus the auth, storage and
  # functions endpoints a managed project has. Without it the fixture is a
  # project with no auth and no storage, which no real operator can have.
  gateway:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    depends_on: [rest]
    volumes: ["./gateway.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["54331:80"]

  # A websocket endpoint, so the fixture models a project that HAS Realtime.
  #
  # Without one the scan correctly reported Realtime as unreachable and
  # therefore unmeasured, and the fixture — which exists to demonstrate a
  # complete clean scan — could not reach exit 0. Same shape as the auth,
  # storage and functions endpoints added earlier: every simplification a
  # fixture makes is a blind spot until the thing it simplified starts
  # mattering.
  #
  # It accepts the upgrade and delivers nothing, which is exactly a correctly
  # configured project: an empty supabase_realtime publication.
  realtime:
    image: jmalloc/echo-server:latest@sha256:86f2c45aa7e7ebe1be30b21f8cfff25a7ed6e3b059751822d4b35bf244a688d5
    expose: ["8080"]
