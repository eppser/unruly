# Answers 401 to everything. A site behind an auth proxy or a WAF.
#
# This one is the trap that produced 2684 invented relations in an early
# version: a 401 arrives BEFORE the schema is consulted, so it says nothing
# about whether the relation exists.
server {
  listen 80;
  location / {
    default_type application/json;
    return 401 '{"message":"unauthorized"}';
  }
}
