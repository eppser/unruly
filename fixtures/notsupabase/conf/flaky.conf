# Behaves like PostgREST, but throttles a deterministic subset.
#
# This is the case the other decoys cannot reach. The control probe succeeds --
# an absent relation 404s with a PostgREST error body, so the target IS
# discriminating and the scan proceeds. Then a subset of relation probes are
# answered 429.
#
# A 429 is not a misclassification risk: it says nothing about whether a
# relation exists, and ClassifyRead maps it to unknown rather than not-found.
# The risk is SILENT LOSS. A relation that stays throttled is simply absent
# from the report, and an absent relation looks exactly like one that was never
# there -- the same ambiguity, arriving through the network rather than through
# the classifier.
#
# Deterministic rather than random: any relation whose name begins a-m is
# throttled, so a scan of this host is reproducible and the eval can assert an
# exact outcome. The first attempt keyed on paths containing an even digit and
# throttled nothing at all, because the pinned wordlist contains no digits --
# a negative control that never fires is worse than none, since it reports
# success.
server {
  listen 80;

  # The control probe must behave correctly, or the scan refuses the target
  # before it ever reaches the throttled relations.
  location ~ "cannot_exist" {
    default_type application/json;
    return 404 '{"code":"42P01","message":"relation \"public.x\" does not exist"}';
  }

  location ~ "^/rest/v1/[a-m]" {
    default_type application/json;
    return 429 '{"message":"rate limit exceeded"}';
  }

  location / {
    default_type application/json;
    add_header Content-Range "0-0/1";
    return 200 '[{"id":1}]';
  }
}
