# Answers 429 to everything. Models a project being rate-limited, or a WAF
# throttling a scan.
#
# A 429 says nothing about whether a relation exists: it arrives before the
# schema is consulted. The danger is not misclassification but SILENT LOSS --
# a relation that stays throttled is simply absent from the report, and an
# absent relation is indistinguishable from one that was never there.
server {
  listen 80;
  location / {
    default_type application/json;
    return 429 '{"message":"rate limit exceeded"}';
  }
}
