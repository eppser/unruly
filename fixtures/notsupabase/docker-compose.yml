name: unruly-notsupabase

# Negative controls: four hosts that are NOT Supabase.
#
# Every false positive found in the last three iterations was found by pointing
# the scanner at a host that answers uniformly -- 706 invented relations and
# 1,412 findings from a catch-all, an open-signup finding from a host with no
# auth server. Each was found by accident. This fixture makes it deliberate.
#
# The rule these hosts enforce: against a target that is not Supabase, no
# finding above Info severity is correct, because there is nothing there to be
# vulnerable. Info findings ARE expected and are the point -- they are how the
# scan says it could not assess a surface.
services:
  spa:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    volumes:
      - ./conf/spa.conf:/etc/nginx/conf.d/default.conf:ro
      - ./html:/usr/share/nginx/html:ro
    ports: ["127.0.0.1:54361:80"]

  json200:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    volumes: ["./conf/json200.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["127.0.0.1:54362:80"]

  deny:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    volumes: ["./conf/deny.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["127.0.0.1:54363:80"]

  broken:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    volumes: ["./conf/broken.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["127.0.0.1:54364:80"]

  throttle:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    volumes: ["./conf/throttle.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["127.0.0.1:54365:80"]

  flaky:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    volumes: ["./conf/flaky.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["127.0.0.1:54366:80"]
