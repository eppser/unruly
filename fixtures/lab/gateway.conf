# One origin, the way Kong presents a managed project.
#
# The lab served PostgREST bare at the root, which is a realistic SELF-HOSTED
# layout and the reason the scanner's mount-path correction is graded at all.
# But it meant the lab had no auth surface: every Supabase auth check was
# measurable only against a cloud project, behind a secret CI does not have.
#
# This gateway routes the managed paths to REAL services -- not canned JSON --
# so signup, the password policy, anonymous sign-in and the escalation pass are
# all graded against a server that behaves like the product.
server {
  listen 80;

  # GoTrue. The upstream serves /settings, /signup, /token; the managed product
  # mounts that whole tree under /auth/v1.
  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
  }

  # Storage, as a leaking project answers it.
  #
  # Served by the gateway rather than by storage-api. That was tried and did not
  # land (docs/lessons-learned.md, 2026-08-18): the real service switches role
  # per request, and role-level search_path is applied at LOGIN rather than on
  # SET ROLE, so its own tables stop resolving. This models the RESPONSES the
  # scanner reasons about, which is what the checks actually consume -- the
  # trade is realism for three checks that were graded nowhere but a cloud
  # project behind a secret.
  #
  # The shape is the common one: a bucket that accepts an anonymous upload and
  # refuses to let it be deleted again. That combination is what makes the
  # residue finding fire, and it is the configuration people actually write.
  location = /storage/v1/bucket {
    default_type application/json;
    return 200 '[{"id":"public-uploads","name":"public-uploads","public":true},{"id":"private-notes","name":"private-notes","public":false}]';
  }

  location ~ ^/storage/v1/object/list/public-uploads$ {
    default_type application/json;
    return 200 '[{"name":"customer-export.csv"},{"name":"passport-scan.jpg"}]';
  }

  # Public reads serve any name, including one just uploaded: the write probe
  # confirms its upload by fetching it back through this path, exactly as a
  # stranger would.
  #
  # The body must equal, byte for byte, what probeBucketWrite uploads. That
  # check is the difference between a bucket that ACCEPTED an upload and one
  # that STORED it, which is a real distinction: a gateway can answer 200 and
  # keep nothing. An ASCII hyphen here instead of the em dash the probe writes
  # was enough to make the write finding disappear while the bucket and residue
  # findings both still fired.
  location ~ ^/storage/v1/object/public/public-uploads/ {
    default_type text/plain;
    return 200 'unruly write probe — safe to delete';
  }

  # Uploads accepted, deletions refused.
  location ~ ^/storage/v1/object/public-uploads/ {
    default_type application/json;
    if ($request_method = POST) {
      return 200 '{"Key":"public-uploads/probe"}';
    }
    if ($request_method = DELETE) {
      return 403 '{"statusCode":"403","error":"Unauthorized","message":"new row violates row-level security policy"}';
    }
    return 404 '{"error":"not_found"}';
  }

  # Any other bucket does not exist, which is what makes bucket existence
  # decidable without listing.
  location ~ ^/storage/v1/object/ {
    default_type application/json;
    return 400 '{"statusCode":"400","error":"Bucket not found","message":"Bucket not found"}';
  }

  # Everything else is PostgREST, mounted where the managed product puts it.
  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
  }
}
