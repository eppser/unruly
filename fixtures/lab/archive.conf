# A stand-in for a public web archive.
#
# The two historic-key findings were the last ids no scan had ever produced,
# and the reason given was that nobody can put a key of their own into
# web.archive.org. That was true and beside the point: history.Options carries
# an ArchiveBase, so the archive is addressable and a local one is enough.
#
# Serves the two endpoints the package actually calls:
#
#   /cdx/search/cdx   the index, as "timestamp original" lines
#   /web/<ts>id_/<original>   the archived bytes
#
# Three captures, one per branch of snapshotFinding:
#
#   a-service.js   a service_role key   -> critical, service key exposed
#   b-current.js   the CURRENT anon key -> high, archived key never rotated
#   c-rotated.js   a superseded anon key -> info, rotated
server {
    listen 80;
    default_type text/plain;

    location = /cdx/search/cdx {
        return 200 '20200101000000 http://archived.test/a-service.js
20210202000000 http://archived.test/b-current.js
20220303000000 http://archived.test/c-rotated.js
';
    }

    # The archived bytes. The path carries the original URL, so match on its
    # tail rather than trying to reproduce the whole thing.
    location ~ a-service\.js$ { root /usr/share/nginx/html; try_files /a-service.js =404; }
    location ~ b-current\.js$ { root /usr/share/nginx/html; try_files /b-current.js =404; }
    location ~ c-rotated\.js$ { root /usr/share/nginx/html; try_files /c-rotated.js =404; }

    # Served, and deliberately NOT in the index above.
    #
    # d-rotated-away.js carries a key signed with a different secret, which is
    # what rotation actually produces and the one thing every other token this
    # fixture mints cannot be: they are all accepted. It exists as the negative
    # control for the exploit harness's "the archived key still authenticates"
    # technique, which without it passes whatever it is pointed at.
    #
    # Out of the index because the SCANNER walks the index, and a fourth
    # capture would change what a scan of this fixture reports. The harness
    # fetches it by URL, which is how a negative control should reach a
    # fixture: without moving the thing being graded.
    location ~ d-rotated-away\.js$ { root /usr/share/nginx/html; try_files /d-rotated-away.js =404; }
}
