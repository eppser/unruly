# A PostgREST-shaped host that refuses SOME probes with 429.
#
# unruly-probes-unresolved is the scanner's "I could not measure this"
# signal, and it is the closest thing the tool has to a thesis statement: a
# candidate that got no readable answer is indistinguishable in a report from
# one that was measured and found absent, unless something says so. It had
# never been produced by a scan of any target.
#
# The throttling is deliberately PARTIAL. Refusing everything would make the
# control probe fail too, and the target would be reported as
# non-discriminating -- a different and louder finding. What this reproduces is
# the case that actually happens in the field: a project under a rate limit
# where most probes answer and some do not, so the relation list is a lower
# bound and the scan has to say so.
server {
    listen 80;
    default_type application/json;

    # Four names from the pinned wordlist are refused. Everything else,
    # including the control relation that cannot exist, answers normally.
    location ~ ^/(user|users|token|tokens)$ {
        return 429 '{"message":"rate limit exceeded"}';
    }
    location / {
        return 404 '{"code":"PGRST205","details":null,"hint":null,"message":"Could not find the table in the schema cache"}';
    }
}
