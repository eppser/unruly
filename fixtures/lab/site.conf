# An application whose admin routes disagree about authentication.
#
# app-route-auth-inconsistency is a real finding class -- a route that answers
# anonymously while its siblings demand credentials is usually one somebody
# forgot, and routes under an admin prefix commonly run with the service_role
# key -- and no scan had ever produced it. It was built only by unit tests.
#
# The family needs at least two protected siblings and one open one, so:
#
#   /api/admin/users     200   <- the one that was forgotten
#   /api/admin/settings  401
#   /api/admin/logs      401
#
# All three are referenced from index.html, because routes are DISCOVERED from
# the application's own markup rather than guessed.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/admin/users {
        default_type application/json;
        return 200 '{"users":[{"id":1,"email":"admin@example.invalid"}]}';
    }
    location = /api/admin/settings {
        default_type application/json;
        return 401 '{"error":"unauthorized"}';
    }
    location = /api/admin/logs {
        default_type application/json;
        return 401 '{"error":"unauthorized"}';
    }

    # A CONSISTENT family, so the fixture grades precision as well as recall.
    # Every sibling is open on purpose: a public API is not a finding, and a
    # scanner that flags one is unusable on the applications people actually
    # run.
    location = /api/public/stats {
        default_type application/json;
        return 200 '{"visitors":41}';
    }
    location = /api/public/health {
        default_type application/json;
        return 200 '{"ok":true}';
    }
    location = /api/public/version {
        default_type application/json;
        return 200 '{"version":"1.0.0"}';
    }
}
