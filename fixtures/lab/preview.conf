# A stale preview deployment that still serves a Supabase key.
#
# supabase-preview-deployment-key had never been produced by a scan. A branch
# build that nobody remembers is exactly where a live credential survives a
# production rotation, which is the case the preview package argues hardest
# for -- and the rule had only ever been built by unit tests.
#
# The key here is a DIFFERENT anon key from the one production serves, so the
# medium branch fires: a credential the operator may not know is live, which
# rotating production would not have touched. Serving the same key would be the
# low branch instead -- an extra distribution channel for something already
# public.
#
# Deliberately no service_role key: that produces the CRITICAL
# supabase-service-key-exposed finding, which outranks this one and would mask
# what this fixture is for. The site fixture on :54322 covers that case.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
}
