# A REAL rate limit in front of a REAL PostgREST.
#
# This file is included inside nginx's http block (conf.d/*.conf), which is
# where limit_req_zone has to live.
#
# The difference between this and fixtures/lab/throttled.conf matters enough to
# state twice. That fixture returns 429 for four hard-coded relation names and
# proxies nothing; it is a mock of a symptom. Here the refusal is a function of
# REQUEST RATE and of nothing else: the same path answers 200 or 429 depending
# on how recently it was asked, and behind the limiter is a genuine PostgREST
# over a genuine schema. Which probes get refused therefore depends on timing,
# so two identical scans produce two different relation lists. That
# non-determinism is the property this target exists to measure.
#
# rate=5r/s is one request per 200ms, and burst=12 is the depth of the queue.
# nodelay means an excess request is refused immediately rather than parked --
# without it nginx would DELAY requests instead of rejecting them, and the
# target would measure latency handling rather than refusal handling. Both are
# real failure modes; this project is about the second.
#
# burst started at 8 and was raised after measuring the VERIFIER's own rate:
# lib/check.py issues 22 HTTP requests during a run of this project in about
# 4.1 seconds, which averages 5.4 r/s -- above the 5 r/s limit. The runs passed
# only because the burst queue absorbed the excess, which is a fixture one
# faster machine away from being flaky. 12 leaves real headroom for the
# harness while still refusing 17 of 30 parallel probes, so the property being
# measured survives and the answer key does not become a coin flip.
limit_req_zone $binary_remote_addr zone=probes:10m rate=5r/s;

# Without this the refusal is 503, which reads as "the origin is down" rather
# than "you are going too fast". A scanner that retries a 503 and gives up on a
# 429, or the reverse, gets a different relation list from the same host.
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # The managed-product shape: PostgREST is mounted under /rest/v1/ and is
    # NOT published to the host. Every request in this project passes through
    # the limiter; there is no unthrottled side door.
    location /rest/v1/ {
        limit_req zone=probes burst=12 nodelay;
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Anything outside the REST mount is a plain 404 in PostgREST's own shape,
    # so a scanner cannot separate "wrong prefix" from "throttled" by the body.
    location / {
        default_type application/json;
        return 404 '{"code":"PGRST205","details":null,"hint":null,"message":"Could not find the table in the schema cache"}';
    }
}
