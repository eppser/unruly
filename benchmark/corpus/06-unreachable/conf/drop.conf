# Mode 2 of 3: accepts the connection, then drops it.
#
# nginx's non-standard 444 closes the connection without sending any response
# line at all. The TCP handshake SUCCEEDS -- the socket connects, the request
# is written and accepted -- and then there is nothing to read.
#
# This is the mode that fools a liveness check. "Can I open a socket to this
# host" answers yes, so a scanner that gates on connectivity proceeds, gets
# nothing back from every probe, and has to decide what an empty answer means.
# Reported as "no findings", it is a clean bill of health for a host that
# answered no question.
server {
    listen 80;
    location / {
        return 444;
    }
}
