# Mode 3 of 3: answers HTTP, but there is no backend behind it.
#
# The proxy target is 127.0.0.1:9 INSIDE this container. Port 9 is discard and
# nothing is bound to it, so every proxied request fails to connect and nginx
# synthesises its own 502 page.
#
# Using a literal address rather than a hostname is deliberate. nginx resolves
# upstream hostnames at CONFIGURATION LOAD time when they appear in a bare
# proxy_pass, so `proxy_pass http://nosuchhost:3000;` does not model a dead
# backend -- it stops the container from starting, which is a fourth mode
# nobody asked for and which presents on the wire as mode 1.
#
# What this models: a gateway whose origin is down. The host is fully
# reachable. It answers every request. It answers with text/html and no JSON,
# no PostgREST error code and no schema. Nothing about the API behind it can
# be measured, and "no findings" is again the wrong report.
server {
    listen 80;
    location / {
        proxy_pass http://127.0.0.1:9;
        proxy_connect_timeout 2s;
    }
}
