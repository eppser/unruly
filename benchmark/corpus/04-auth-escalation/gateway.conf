# One origin, the way Kong presents a managed project: /rest/v1 -> PostgREST,
# /auth/v1 -> GoTrue. Both are real services on the compose network.
#
# Nothing is stubbed here. The whole point of this target is that a token
# obtained from the auth service on this origin is accepted by the REST service
# on the same origin, so both halves have to be the real thing.
server {
  listen 80;

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
  }

  # GoTrue serves /settings, /signup, /token at its root; the managed product
  # mounts that whole tree under /auth/v1. The same service is also published
  # directly on 54433 so it can be driven by hand without the proxy in the way.
  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
  }

  # A managed project answers 404 from Kong for an unrouted path. The
  # distinction between that and a service-level answer is what makes the mount
  # points decidable.
  location / {
    default_type application/json;
    return 404 '{"message":"no Route matched with those values"}';
  }
}
