# The gateway that destroys PostgREST's error semantics.
#
# Two things a scanner leans on disappear here, and both are things real
# deployments do:
#
#   1. The API is not at / and not at /rest/v1. It is at /api/db/v2/, a prefix
#      no wordlist guesses. This is what an API-gateway route or a Next.js
#      rewrite looks like.
#
#   2. Every 4xx from the upstream is replaced with ONE status and ONE body.
#      401, 403 and 404 all come back as 403 with a fixed JSON blob. So
#      "42501: this table exists and you may not read it" and "PGRST205: this
#      table does not exist" become the same eleven bytes of status line.
#
# 2xx is passed through untouched, headers included. That is load-bearing:
# PostgREST reports row counts in Content-Range, and a proxy that dropped or
# rewrote it would make the readable half of this project unmeasurable too,
# which is a different and less interesting target.
server {
    listen 80;

    # The app shell. A gateway in front of an API usually has a site in front
    # of it, and the site is what a scanner meets first. 200 text/html, no
    # hint that a database is mounted three segments down.
    location = / {
        default_type text/html;
        return 200 '<!doctype html><html><head><title>Bench 07</title></head><body><div id="app">app shell</div></body></html>';
    }

    # PostgREST, mounted where nothing looks for it. The trailing slash on
    # proxy_pass strips the /api/db/v2/ prefix, so the upstream sees /
    # and its own OpenAPI document is served through this path.
    location /api/db/v2/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;

        # The rewrite. proxy_intercept_errors makes nginx handle upstream
        # error responses itself instead of forwarding them; error_page with
        # `= @generic` takes the STATUS from the named location too, which is
        # what collapses 401 and 404 into 403 rather than merely replacing
        # their bodies.
        proxy_intercept_errors on;
        error_page 401 403 404 = @generic;
    }

    location @generic {
        default_type application/json;
        return 403 '{"error":"request could not be completed","ref":"gw"}';
    }

    # Everything else, including /rest/v1/ and the bare relation names a
    # wordlist would try at the root, is not the API. nginx's own 404.
    location / {
        return 404;
    }
}
