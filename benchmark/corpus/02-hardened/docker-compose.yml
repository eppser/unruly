# Compose project name is explicit. Without it Docker derives it from the
# directory name, so `02-hardened` from two checkouts would share containers
# and volumes and each would see the other's database.
name: unruly-bench-02

# The MANAGED layout: one origin, real services behind it. Kong is stood in for
# by nginx (see gateway.conf), which is enough because what the scanner
# consumes is the path shape and the responses, not Kong's plugin model.
#
# Only the gateway binds a host port. PostgREST and GoTrue are reachable on the
# compose network and nowhere else, which is the arrangement a competent
# operator actually ends up with and which removes the "the scanner found the
# bare backend on a neighbouring port" shortcut.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: fixture
      POSTGRES_DB: fixture
    ports: ["54412:5432"]
    volumes:
      # Mounted FILE BY FILE. The postgres entrypoint iterates
      # /docker-entrypoint-initdb.d/* and matches on extension; a subdirectory
      # falls through to the catch-all and is logged as "ignoring", which
      # presents as a database with correct roles and no tables.
      #
      # 00a_ sorts after 00_ and before 01_, which is the order this needs:
      # PostgREST's roles, then GoTrue's role and schema, then the tables. The
      # auth admin has to exist before the auth container starts or its
      # migrations fail and it restarts forever with nothing in the log naming
      # the cause.
      - ../lib/00_roles.sql:/docker-entrypoint-initdb.d/00_roles.sql:ro
      - ./schema/00a_auth_roles.sql:/docker-entrypoint-initdb.d/00a_auth_roles.sql:ro
      - ./schema/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fixture"]
      interval: 2s
      timeout: 3s
      retries: 30

  # NOT published. The only way in is the gateway.
  rest:
    image: public.ecr.aws/supabase/postgrest:v14.3
    depends_on:
      db: {condition: service_healthy}
    environment:
      PGRST_DB_URI: postgres://authenticator:fixture@db:5432/fixture
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      # Claims arrive as `request.jwt.claims`, which is what auth.uid() reads.
      # With legacy GUCs on it would return NULL for every request and the
      # owner-scoped tables would look locked to their own owners.
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_OPENAPI_SERVER_PROXY_URI: http://127.0.0.1:54411/rest/v1

  # NOT published either. Configured the safe way; every one of these settings
  # is asserted over HTTP in answer-key.yaml rather than trusted because it is
  # written here.
  auth:
    image: public.ecr.aws/supabase/gotrue:v2.151.0
    depends_on:
      db: {condition: service_healthy}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54411/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:fixture@db:5432/fixture
      GOTRUE_SITE_URL: http://127.0.0.1:54411
      GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      # The four settings this project is the control for.
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_PASSWORD_MIN_LENGTH: "12"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_LOG_LEVEL: warn
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9999/settings"]
      interval: 2s
      timeout: 3s
      retries: 40

  gateway:
    image: nginx:alpine
    # BOTH upstreams must be resolvable before nginx starts. nginx resolves the
    # host in a literal proxy_pass at CONFIG LOAD time and exits if it cannot,
    # so a gateway that merely `depends_on: [auth]` dies with
    # "host not found in upstream" whenever the auth container is slow or has
    # crashed -- which is how this was found, and which presents as a gateway
    # that is down for a reason that has nothing to do with the gateway.
    #
    # `rest` is a plain dependency (started, not healthy): the PostgREST image
    # ships no healthcheck and no shell to add one with, and starting the
    # container is enough for its name to resolve. `auth` is the one that has
    # to be HEALTHY, because it is the one that can come up, fail a migration
    # and exit.
    depends_on:
      rest: {condition: service_started}
      auth: {condition: service_healthy}
    volumes: ["./gateway.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["54411:80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/auth/v1/settings || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 40
