# One origin, the way Kong presents a managed project: /rest/v1 -> PostgREST,
# /auth/v1 -> GoTrue, /storage/v1 -> Storage.
#
# REST and AUTH are real services on the compose network. STORAGE is a stub
# that answers the way a correctly configured project answers, and the reason
# is recorded rather than hidden: storage-api switches role per request and
# role-level search_path is applied at LOGIN rather than on SET ROLE, so its
# own tables stop resolving in this arrangement (fixtures/lab/gateway.conf
# carries the same note). What a scanner consumes from storage is the response,
# and these are the responses. The README says so too.

server {
  listen 80;

  # PostgREST, mounted where the managed product mounts it.
  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
  }

  # GoTrue. The upstream serves /settings, /signup, /token at its root.
  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
  }

  # --- storage, refusing ----------------------------------------------------
  #
  # Listing buckets requires service_role in a correctly configured project;
  # the anon key gets 401. This is the response Supabase returns, message and
  # all.
  location = /storage/v1/bucket {
    default_type application/json;
    return 401 '{"statusCode":"401","error":"Unauthorized","message":"Invalid JWT"}';
  }

  # No bucket is public, so the public-object route is 400 Bucket not found for
  # every name -- including the two named in this project's tables, which is
  # what makes "there is no anonymous read path" decidable rather than assumed.
  location ~ ^/storage/v1/object/public/ {
    default_type application/json;
    return 400 '{"statusCode":"400","error":"Bucket not found","message":"Bucket not found"}';
  }

  # Anonymous upload refused by RLS on storage.objects, which is the default
  # and the thing project 02 is the control for. 403, not 401: the JWT is
  # valid, the policy is what says no.
  location ~ ^/storage/v1/object/ {
    default_type application/json;
    if ($request_method = POST) {
      return 403 '{"statusCode":"403","error":"Unauthorized","message":"new row violates row-level security policy"}';
    }
    if ($request_method = PUT) {
      return 403 '{"statusCode":"403","error":"Unauthorized","message":"new row violates row-level security policy"}';
    }
    if ($request_method = DELETE) {
      return 403 '{"statusCode":"403","error":"Unauthorized","message":"new row violates row-level security policy"}';
    }
    return 400 '{"statusCode":"400","error":"Bucket not found","message":"Bucket not found"}';
  }

  # Anything else on this origin does not exist. A managed project answers
  # 404 from Kong for an unrouted path, and the distinction between that and a
  # service-level answer is what makes the mount points decidable.
  location / {
    default_type application/json;
    return 404 '{"message":"no Route matched with those values"}';
  }
}
